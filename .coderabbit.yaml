# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Provide actionable, concise, and constructive engineering feedback for a modern Next.js 16 App Router, TypeScript, and Supabase eCommerce application."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true

chat:
  auto_reply: true
